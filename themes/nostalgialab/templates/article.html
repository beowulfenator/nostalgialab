{% extends "base.html" %}

{% block title %}{{ article.title | striptags }} · {{ SITENAME }}{% endblock %}

{% block content %}
			<section id="main" class="wrapper">
				<div class="inner">
					<h1 class="major">{{ article.title }}</h1>
					<p><small>{{ article.locale_date }}</small></p>
					{{ article.content }}
				</div>
			</section>
{% endblock %}
