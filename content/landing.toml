# --- Prístup: striedajúce sa bloky obrázok + text ------------------------------
[about]
nav = "Náš prístup"

[[about.items]]
title = "Inžinierstvo s dlhou životnosťou"
text = """
Najlepší softvér je ten, ktorý sa dá o päť rokov ešte stále čítať, upravovať a rozvíjať. \
Staviame na overených technológiách, čistej architektúre a dôkladných testoch.

Jednoduchosť pre nás nie je kompromis, ale cieľ.
"""
image = "images/pic01.jpg"
image_position = "center center"

[[about.items]]
title = "Poradenstvo bez skratiek"
text = """
Pomôžeme vám zorientovať sa vo svete technológií: vybrať vhodné nástroje, zhodnotiť \
existujúce riešenie alebo naplánovať ďalší krok.

Otvorene, vecne a s ohľadom na váš rozpočet – aj keď je najlepšou radou nič nemeniť.
"""
image = "images/pic02.jpg"
image_position = "center center"

[[about.items]]
title = "Partnerstvo, nie len dodávka"
text = """
Za každým projektom je skutočný biznis a skutoční ľudia. Pracujeme v krátkych \
iteráciách, priebežne ukazujeme výsledky a o rozhodnutiach hovoríme zrozumiteľne.

Na konci nedostanete len kód, ale aj dokumentáciu a znalosti, ako s ním pracovať ďalej.
"""
image = "images/pic03.jpg"
image_position = "center center"


