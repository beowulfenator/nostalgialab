title = "Čo robíme"
text = """
Od prvého nápadu cez návrh a vývoj až po prevádzku. Môžeme prevziať celý projekt, \
posilniť váš tím alebo vám len pomôcť s rozhodnutím, ktoré vás trápi.
"""

[[services.features]]
icon = "solid fa-code"
title = "Vývoj softvéru na mieru"
text = "Aplikácie navrhnuté presne podľa vašich procesov – od interných nástrojov po systémy, na ktorých stojí celý biznis."

[[services.features]]
icon = "solid fa-layer-group"
title = "Webové aplikácie a API"
text = "Spoľahlivé webové riešenia a rozhrania, ktoré zvládnu rast a dobre sa prepájajú s ostatnými systémami."

[[services.features]]
icon = "solid fa-history"
title = "Modernizácia starších systémov"
text = "Staré aplikácie nemusíte zahodiť. Postupne ich zrefaktorujeme, zabezpečíme a pripravíme na ďalšie roky."

[[services.features]]
icon = "solid fa-compass"
title = "Technologické poradenstvo"
text = "Výber technológií, návrh architektúry a plánovanie projektov. Nezávislý pohľad, ktorý šetrí čas aj peniaze."

[[services.features]]
icon = "solid fa-search"
title = "Audit kódu a architektúry"
text = "Dôkladná analýza existujúceho riešenia: kvalita kódu, bezpečnosť, výkon a konkrétne odporúčania, čo zlepšiť."

[[services.features]]
icon = "solid fa-cogs"
title = "Automatizácia a integrácie"
text = "Prepojíme vaše nástroje a zautomatizujeme opakujúcu sa prácu, aby sa váš tím mohol venovať tomu podstatnému."

[[services.features]]
icon = "solid fa-chalkboard-teacher"
title = "Školenia a mentoring"
text = "Workshopy a individuálny mentoring pre vývojárov a tímy – od dobrých praktík po konkrétne technológie."

[[services.features]]
icon = "solid fa-shield-alt"
title = "Spoľahlivá prevádzka"
text = "Nasadenie, monitoring a údržba, aby váš softvér fungoval aj vtedy, keď sa naň nikto nepozerá."


